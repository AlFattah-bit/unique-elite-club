
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Elite Club | Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #173b2b;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { line-height: 1.5; color: #53665b; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd7cf;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Unique Elite Club</h1>
    <p>Administrator sign-in</p>

    <form id="adminLogin">
      <label for="email">Admin email</label>
      <input id="email" type="email"
        autocomplete="username"
        placeholder="Enter admin email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password"
        placeholder="Enter password" required>

      <button type="submit">Sign In</button>
    </form>

    <p id="message" role="status">
      Secure administrator access.
    </p>
  </main>

  <script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
(() => {
  const form = document.getElementById("adminLogin");
  const message = document.getElementById("message");
  const button = form.querySelector("button[type='submit']");

  let db;

  try {
    const config = window.CLUB_CONFIG;

    if (!config || !config.url || !config.publishableKey) {
      message.textContent =
        "Configuration missing. Please check config.js.";
      button.disabled = true;
      return;
    }

    if (!window.supabase) {
      message.textContent =
        "Supabase library failed to load. Check your internet connection.";
      button.disabled = true;
      return;
    }

    db = window.supabase.createClient(
      config.url,
      config.publishableKey
    );

    message.textContent = "Ready to connect securely.";
  } catch (error) {
    message.textContent = "Could not initialize Supabase.";
    button.disabled = true;
    return;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    message.textContent = "Signing in...";

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Sign-in failed: " + error.message;
        return;
      }

      message.textContent =
        "Login successful. Administrator permissions still need to be verified before the dashboard can be accessed.";
    } catch (error) {
      message.textContent =
        "Connection error. Please check your internet and try again.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
